<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>{{FILENAME}}</title>
		{{META_TAGS}}
		<link rel="stylesheet" href="/src/styles/main.css" />
	</head>
	<body class="bg-base-200 min-h-screen">
		<div class="max-w-4xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
			<div class="text-center mb-6">{{MEDIA_CONTENT}}</div>

			<div class="card bg-base-100 shadow-xl mb-6">
				<div class="card-body">
					<h2 class="card-title text-xl mb-4">{{FILENAME}}</h2>
					<div class="space-y-2 text-sm">
						<p><strong>Type:</strong> {{FILETYPE}}</p>
						<p><strong>Uploaded At:</strong> {{UPLOADED_AT}}</p>
						<p><strong>Access Count:</strong> {{ACCESS_COUNT}} / 100</p>
						<p><a href="{{DOWNLOAD_URL}}" class="link link-primary">Download File</a></p>
					</div>
				</div>
			</div>

			<div class="text-center">
				<a href="{{ORIGIN_URL}}/list" class="link link-primary">← Back to list</a>
			</div>
		</div>
	</body>
</html>
