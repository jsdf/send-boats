<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Upload File</title>
		<link rel="stylesheet" href="/src/styles/main.css" />
	</head>
	<body class="bg-gray-50 min-h-screen">
		<div class="max-w-4xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
			<h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-6">Upload File</h1>

			<form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data" class="space-y-6 bg-white p-6 rounded-lg shadow-sm">
				<div>
					<label for="file" class="block text-sm font-medium text-gray-700 mb-2">
						Select a file:
					</label>
					<input
						type="file"
						id="file"
						name="file"
						required
						class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent p-2"
					/>
				</div>

				<div id="previewSection" class="hidden">
					<h3 class="text-lg font-medium text-gray-900 mb-4">Select a preview image:</h3>
					<div id="previewContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
						<!-- Preview thumbnails will be inserted here -->
					</div>
				</div>

				<input type="hidden" id="previewDataInput" name="preview" />

				<div>
					<button
						type="submit"
						id="submitBtn"
						class="w-full sm:w-auto px-6 py-2.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors"
					>
						Upload File
					</button>
				</div>
			</form>

			<p class="mt-6">
				<a href="/list" class="text-blue-600 hover:text-blue-800 hover:underline">
					Go to file list
				</a>
			</p>
		</div>

		<script type="module" src="/src/scripts/upload.ts"></script>
	</body>
</html>
