<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Upload File</title>
		<link rel="stylesheet" href="/src/styles/main.css" />
	</head>
	<body class="bg-base-200 min-h-screen">
		<div class="max-w-4xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
			<h1 class="text-2xl sm:text-3xl font-bold mb-6">Upload File</h1>

			<form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data" class="card bg-base-100 shadow-xl">
				<div class="card-body space-y-6">
					<div class="form-control">
						<label for="file" class="label">
							<span class="label-text">Select a file:</span>
						</label>
						<input
							type="file"
							id="file"
							name="file"
							required
							class="file-input file-input-bordered w-full"
						/>
					</div>

					<div id="previewSection" class="hidden">
						<h3 class="text-lg font-semibold mb-4">Select a preview image:</h3>
						<div id="previewContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
							<!-- Preview thumbnails will be inserted here -->
						</div>
					</div>

					<input type="hidden" id="previewDataInput" name="preview" />

					<div>
						<button
							type="submit"
							id="submitBtn"
							class="btn btn-primary w-full sm:w-auto"
						>
							Upload File
						</button>
					</div>
				</div>
			</form>

			<p class="mt-6">
				<a href="/list" class="link link-primary">
					Go to file list
				</a>
			</p>
		</div>

		<script type="module" src="/src/scripts/upload.ts"></script>
	</body>
</html>
